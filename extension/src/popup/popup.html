<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>claude-for-arc</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f5f5f4;
      --text: #1c1917;
      --muted: #78716c;
      --border: #e7e5e4;
      --accent: #c2410c;
      --ok: #16a34a;
      --warn: #d97706;
      --bad: #dc2626;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --surface: #292524;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --border: #44403c;
        --accent: #fb923c;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 360px;
      margin: 0;
      padding: 14px 16px 12px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .lang { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 2px; background: var(--surface); }
    .lang button { border: 0; background: transparent; border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 600; color: var(--muted); }
    .lang button[aria-pressed=true] { background: var(--accent); color: #fff; }
    h1 { font-size: 15px; margin: 0; }
    section { border-top: 1px solid var(--border); padding: 10px 0; }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
    .status { display: flex; align-items: center; gap: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
    .dot.connected { background: var(--ok); }
    .dot.connecting { background: var(--warn); }
    .dot.nokey, .dot.badkey { background: var(--bad); }
    #statusText { flex: 1; }
    button {
      font: inherit; color: var(--text); background: var(--surface);
      border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    input[type=password], input[type=text], textarea {
      width: 100%; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text);
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px;
    }
    textarea { height: 78px; resize: vertical; }
    .row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
    .row input { flex: 1; }
    label.opt { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; cursor: pointer; }
    label.opt input { margin-top: 2px; }
    .hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
    .pause { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .pause.on { color: var(--bad); font-weight: 600; }
    #log { list-style: none; margin: 0; padding: 0; max-height: 150px; overflow-y: auto; font-size: 12px; }
    #log li { display: grid; grid-template-columns: 42px 16px 1fr; gap: 4px; padding: 2px 0; border-bottom: 1px dashed var(--border); }
    #log .t { color: var(--muted); font-variant-numeric: tabular-nums; }
    #log .ok { color: var(--ok); }
    #log .err { color: var(--bad); }
    #log .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    footer { color: var(--muted); font-size: 11px; padding-top: 8px; border-top: 1px solid var(--border); }
    .saved { color: var(--ok); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>claude-for-arc</h1>
    <div class="lang" role="group" aria-label="Language">
      <button id="langEn" data-lang="en" aria-pressed="false">EN</button>
      <button id="langRu" data-lang="ru" aria-pressed="false">RU</button>
    </div>
  </header>

  <section>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText" data-i18n="checking"></span>
      <button id="reconnect" data-i18n="reconnect"></button>
    </div>
    <p class="hint" id="statusHint"></p>
  </section>

  <section>
    <div class="pause" id="pauseRow">
      <span id="pauseText"></span>
      <button id="pause"></button>
    </div>
  </section>

  <section id="keySection">
    <h2 data-i18n="keyTitle"></h2>
    <div id="keySaved" hidden>
      <div class="row">
        <span class="saved" data-i18n="keyInPlace"></span>
        <button id="changeKey" data-i18n="enterManually"></button>
      </div>
    </div>
    <div id="keyForm" hidden>
      <div class="row">
        <input type="password" id="token" data-i18n-placeholder="keyPlaceholder" autocomplete="off" spellcheck="false">
        <button class="primary" id="saveToken" data-i18n="save"></button>
      </div>
      <p class="hint"><span data-i18n="keyHint"></span> <code>cat ~/Library/Application\ Support/claude-for-arc/token</code>.</p>
    </div>
  </section>

  <section>
    <h2 data-i18n="accessTitle"></h2>
    <label class="opt"><input type="radio" name="scope" value="own">
      <span><span data-i18n="scopeOwn"></span> <span class="hint" data-i18n="recommended"></span></span></label>
    <label class="opt"><input type="radio" name="scope" value="all">
      <span data-i18n="scopeAll"></span></label>
    <label class="opt"><input type="checkbox" id="readOnly">
      <span data-i18n="readOnly"></span></label>
    <label class="opt"><input type="checkbox" id="allowHistory">
      <span data-i18n="allowHistory"></span></label>
  </section>

  <section>
    <h2 data-i18n="blockedTitle"></h2>
    <textarea id="blocklist" spellcheck="false" placeholder="mybank.com"></textarea>
    <div class="row">
      <button id="saveBlocklist" data-i18n="saveList"></button>
      <span class="saved" id="blocklistSaved" data-i18n="saved" hidden></span>
    </div>
    <p class="hint" data-i18n="blockedHint"></p>
  </section>

  <section>
    <h2 data-i18n="logTitle"></h2>
    <ul id="log"></ul>
    <p class="hint" id="logEmpty" data-i18n="logEmpty"></p>
  </section>

  <footer data-i18n="footer"></footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
