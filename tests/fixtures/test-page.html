<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>claude-for-arc test page</title>
  <style>
    /* CSS_MARKER: this stylesheet must never appear in extracted text */
    body { font-family: sans-serif; margin: 2rem; }
    .tall { height: 3000px; background: linear-gradient(#fff, #eef); }
    #hidden { display: none; }
  </style>
  <script>
    // SCRIPT_MARKER: this script source must never appear in extracted text
    window.clicks = 0;
  </script>
</head>
<body>
  <main>
    <h1>Тестовая страница</h1>
    <article>
      <p>VISIBLE_MARKER: это видимый текст статьи, его извлечение обязано вернуть.</p>
      <p>Второй абзац для проверки переносов строк.</p>
      <p id="long-text"></p>
    </article>

    <form id="form" onsubmit="event.preventDefault(); document.getElementById('result').textContent = 'SUBMITTED:' + document.getElementById('name').value;">
      <label for="name">Имя</label>
      <input id="name" name="name" type="text" placeholder="Ваше имя">

      <label for="pass">Пароль</label>
      <input id="pass" name="password" type="password" placeholder="Пароль" value="SECRET_VALUE">

      <label for="card">Номер карты</label>
      <input id="card" name="cardNumber" autocomplete="cc-number" placeholder="Номер карты">

      <label for="comment">Комментарий</label>
      <textarea id="comment" name="comment" placeholder="Комментарий"></textarea>

      <button id="submit" type="submit">Отправить форму</button>
    </form>

    <p id="result">NOT_SUBMITTED</p>

    <button id="counter" type="button" onclick="window.clicks++; this.textContent = 'Нажато: ' + window.clicks">Нажми меня</button>
    <button id="disabled" type="button" disabled>Выключенная кнопка</button>
    <!-- Counts presses like press-handling UI libraries: a press on pointerup,
         and a click with no pointer behind it as a separate press. A real
         mouse click counts once. -->
    <button id="press" type="button">Отправить сообщение</button>
    <script>
      window.presses = 0;
      (() => {
        const b = document.getElementById("press");
        const count = () => { window.presses++; b.textContent = "Отправлено раз: " + window.presses; };
        // A real mouse click: one press on pointerup, its click has detail 1.
        b.addEventListener("pointerup", (e) => { if (e.button === 0) count(); });
        // A click with detail 0 has no pointer behind it (keyboard, screen
        // reader, element.click()): a press of its own.
        b.addEventListener("click", (e) => { if (e.detail === 0) count(); });
      })();
    </script>

    <p><a id="link-a" href="#section-a">Ссылка на раздел A</a> · <a id="link-ext" href="https://example.com/">Внешняя ссылка</a></p>

    <div id="hidden">HIDDEN_MARKER</div>
    <div id="late"></div>
    <script>
      setTimeout(() => { document.getElementById('late').textContent = 'LATE_MARKER'; }, 1500);
    </script>

    <div class="tall"></div>
    <h2 id="section-a">Раздел A</h2>
    <p>BOTTOM_MARKER: конец страницы.</p>
    <label for="records">Тип записи</label>
    <select id="records">
      <option value="a">Address</option>
      <option value="disabled" disabled>Disabled</option>
      <option value="txt">Text record</option>
    </select>
    <label for="attachment">Файл для импорта</label>
    <input type="file" id="attachment" accept=".txt">
    <p id="attachment-result">NO_ATTACHMENT</p>
    <button id="select-long-text" type="button">Select long text</button>
    <button id="reload" type="button">Reload fixture</button>
    <p id="navigation-result"></p>
    <label for="disk-size">Размер диска</label>
    <input id="disk-size" inputmode="numeric" value="10">
    <div id="disk-slider-label">Размер SSD</div>
    <div id="disk-slider" role="slider" tabindex="0" aria-labelledby="disk-slider-label"
         aria-valuemin="10" aria-valuemax="100" aria-valuenow="20" aria-valuetext="20 ГиБ">SSD</div>
    <div role="spinbutton" tabindex="0" aria-label="Свободное место" aria-valuenow="0">Место</div>
    <script>
      const longText = document.getElementById("long-text");
      document.getElementById("disk-size").value = "20";
      longText.textContent = "A".repeat(650) + " LONG_TEXT_END";
      document.getElementById("select-long-text").addEventListener("click", () => {
        getSelection().selectAllChildren(longText);
      });
      document.getElementById("attachment").addEventListener("change", async (event) => {
        const file = event.target.files[0];
        document.getElementById("attachment-result").textContent = file
          ? file.name + ": " + await file.text()
          : "NO_ATTACHMENT";
      });
      document.getElementById("reload").addEventListener("click", () => {
        sessionStorage.setItem("fixture-reload-count", Number(sessionStorage.getItem("fixture-reload-count") || 0) + 1);
        location.reload();
      });
      if (performance.getEntriesByType("navigation")[0].type === "reload") {
        document.getElementById("navigation-result").textContent =
          "RELOAD_CONFIRMED:" + sessionStorage.getItem("fixture-reload-count");
      }
    </script>
  </main>
</body>
</html>
